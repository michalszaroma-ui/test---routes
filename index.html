<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Drive Ireland</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen map; a bottom sheet holds four tabs (Go, Explore, Practice, More).
   While driving the sheet shrinks to a stats bar and a road-sign style instruction sits on top.
   Dark-only on purpose: it's used in a car, often after dark. */
:root{
  --asphalt:#14171b; --panel:#1d2228; --panel-2:#272e37; --panel-3:#313a45; --line:#353e49;
  --text:#eef1f4; --muted:#9ba6b2; --marking:#f2c230; --go:#3ccf7a; --warn:#ff6b4a; --blue:#4c8dff;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sl:max(10px,env(safe-area-inset-left,0px)); --sr:max(10px,env(safe-area-inset-right,0px));
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--asphalt);color:var(--text);font-family:var(--body);font-size:15px}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--marking);outline-offset:2px}
a{color:var(--blue)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- Map ---------- */
#map{position:fixed;inset:0;background:#0f1215}
.leaflet-container{background:#0f1215;font-family:var(--body)}
#map.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6)}
.leaflet-control-attribution{background:rgba(20,23,27,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-tooltip{background:var(--panel);color:var(--text);border-color:var(--line)}
.stopmk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;
  color:#101317;border:2px solid #101317;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.stopmk.done{opacity:.35}
.stopmk.home{background:#fff!important;width:30px;height:30px;font-size:12px}
.pin svg{width:34px;height:42px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.poi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--marking);color:#14171b;border:2px solid #14171b;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.poi svg{width:15px;height:15px;stroke-width:2.4}
.poi.ex{background:var(--go)}
.me svg{width:24px;height:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

/* ---------- Floating map buttons ---------- */
.fab{position:fixed;right:var(--sr);z-index:1000;width:48px;height:48px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--marking);box-shadow:0 6px 18px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 128px);z-index:1100;
  background:var(--panel-3);border:1px solid var(--line);padding:9px 14px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center}

/* ---------- Instruction sign (driving) ---------- */
#sign{position:fixed;top:calc(var(--safe-t) + 10px);left:var(--sl);right:var(--sr);z-index:1000;
  display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#sign .icon{flex:0 0 52px;height:52px;display:grid;place-items:center;color:var(--marking)}
#sign .icon svg{width:52px;height:52px}
#sign .txt{min-width:0;flex:1}
#sign .dist{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
#sign .instr{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;margin-top:3px;text-wrap:balance}
#sign.off{border-color:var(--warn)}
#sign.off .icon,#sign.off .dist{color:var(--warn)}
#limitSign{position:fixed;left:var(--sl);z-index:1000;width:62px;height:62px;border-radius:50%;background:#fff;border:7px solid #d62828;
  display:grid;place-items:center;color:#111;font-family:var(--display);font-weight:700;font-size:25px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
#limitSign.unknown{opacity:.45}
#limitSign small{display:block;font-size:9px;text-align:center;margin-top:-1px}

/* ---------- Bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;max-height:66vh}
#grab{display:block;width:100%;padding:8px 0 4px}
#grab span{display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.panes{flex:1;min-height:0;overflow-y:auto;padding:4px var(--sr) 12px var(--sl);-webkit-overflow-scrolling:touch}
#sheet.collapsed .panes{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:4px var(--sr) calc(var(--safe-b) + 4px) var(--sl);background:var(--panel)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em;border-radius:10px}
.tabs button[aria-selected="true"]{color:var(--marking)}
.tabs button[aria-selected="true"] svg.i{stroke-width:2.3}
#sheet.driving #grab,#sheet.driving .panes,#sheet.driving .tabs{display:none}
#driveView{padding:14px var(--sr) calc(var(--safe-b) + 14px) var(--sl)}

h2{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 6px 10px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:16px 6px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub button{color:var(--blue);font-size:12px;text-transform:none;letter-spacing:0}
.note{color:var(--muted);font-size:12.5px;line-height:1.45;margin:12px 6px 0;max-width:65ch}
.note a{color:var(--muted)}

/* Search */
.search{position:relative;display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:13px 40px 13px 42px;border-radius:12px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--marking)}
.search input::-webkit-search-cancel-button{display:none}
.search .lens{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:20px;line-height:1}

/* Lists */
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid transparent}
.item.sel{border-color:var(--marking)}
.item .meta{min-width:0;flex:1}
.item b{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .far{flex:0 0 auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item .ico{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);color:var(--marking)}
.empty{color:var(--muted);font-size:13.5px;padding:8px 6px;line-height:1.4}
.badge{flex:0 0 38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;color:#101317}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.card .chip{background:var(--panel-3)}
.chip svg.i{width:16px;height:16px}
.chip.on{background:var(--marking);border-color:var(--marking);color:#14171b}
.chip.place{font-family:var(--display);font-weight:600;font-size:16px;color:var(--marking)}

/* Nearby grid */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px 9px;border-radius:12px;background:var(--panel-2);font-size:12.5px;font-weight:500;color:var(--text);border:1px solid transparent;text-align:center}
.cat svg.i{color:var(--marking);width:24px;height:24px}
.cat.on{border-color:var(--marking)}

/* Place card */
.card{padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--blue);margin:10px 0 4px}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .top .meta{min-width:0;flex:1}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;text-wrap:balance}
.card .top small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.card .x{flex:0 0 34px;height:34px;border-radius:50%;background:var(--panel-3);color:var(--muted);font-size:20px;line-height:1}
.card p{margin:10px 0 0;line-height:1.45;font-size:14.5px;max-width:65ch}
.trail{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.trail span{padding:4px 9px;border-radius:6px;background:var(--panel-3);font-size:13px;font-weight:600}
.info{margin-top:10px;display:grid;gap:5px;font-size:14px}
.info div{display:flex;gap:10px;min-width:0}
.info span{flex:0 0 58px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.info a,.info em{min-width:0;overflow-wrap:anywhere;font-style:normal}
.eta{margin-top:12px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--go)}
.eta.wait{color:var(--muted);font-weight:500;font-size:15px;font-family:var(--body)}
.card > .chips{margin-top:10px}

/* Segmented controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--panel-2);margin-bottom:6px}
.card .seg{background:var(--panel-3);margin:12px 0 0}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button svg.i{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text)}
.card .seg button[aria-pressed="true"]{background:var(--marking);color:#14171b}

/* Public transport */
.ptwhen{display:flex;gap:8px;margin-top:10px}
.ptwhen select,.ptwhen input{min-width:0;padding:10px;border-radius:10px;background:var(--panel-3);color:var(--text);border:1px solid var(--line);font:inherit;font-size:15px}
.ptwhen select{flex:1}
.ptwhen input{flex:0 0 112px}
#ptList{margin-top:10px}
.pt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--panel-3);border:1px solid transparent}
.pt.sel{border-color:var(--marking)}
.pt .ptt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pt .ptt b{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.pt .ptt span{color:var(--go);font-weight:600;font-variant-numeric:tabular-nums}
.ptc{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px}
.ptc i{color:var(--muted);font-style:normal;font-size:13px}
.lg{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:6px;font-size:13px;font-weight:700;line-height:1.2}
.lg svg.i{width:15px;height:15px;stroke-width:2.2}
.lg.walk{background:transparent;color:var(--muted);padding:3px 2px;font-weight:600}
.pt small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.steps{margin:8px 0 4px;padding:4px 4px 2px 6px;display:grid;gap:0}
.st{display:flex;gap:12px;position:relative;padding-bottom:12px}
.st:not(:last-child)::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.st .dot{flex:0 0 14px;height:14px;border-radius:50%;margin-top:3px;border:2px solid var(--panel-2);box-shadow:0 0 0 2px var(--line);position:relative;z-index:1}
.st .dot.walk{background:var(--panel-3)}
.st div{min-width:0;flex:1}
.st b{display:block;font-weight:600;font-size:14.5px}
.st small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.live{display:inline-block;padding:0 6px;border-radius:4px;background:var(--go);color:#14171b;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:4px;vertical-align:1px}
.ptnote{color:var(--muted);font-size:12px;line-height:1.4;margin:10px 2px 0}
.ptnote a{color:var(--muted)}

/* Buttons */
.actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;text-transform:uppercase}
.btn.primary{background:var(--marking);color:#14171b}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line)}
.btn.danger{background:var(--panel-2);border:1px solid var(--warn);color:var(--warn)}
.btn.small{flex:0 0 auto;padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.4}

/* Explore cards */
.ex{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:12px;background:var(--panel-2)}
.ex .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex b{font-weight:600;font-size:16px}
.ex .far{color:var(--muted);font-size:13px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.ex small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ex p{margin:6px 0 0;font-size:13.5px;line-height:1.4;color:#cfd6dd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:6px;color:#14171b}
.tag.walk{background:var(--go)}.tag.coast{background:#4cc3ff}.tag.view{background:var(--marking)}.tag.heritage{background:#ff9f6b}

/* Settings */
.set{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--panel-2);margin-bottom:6px}
.set .meta{flex:1;min-width:0}
.set b{display:block;font-weight:600}
.set small{display:block;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.switch{position:relative;flex:0 0 50px;height:30px;border-radius:15px;background:var(--panel-3);border:1px solid var(--line);transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--marking);border-color:var(--marking)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#14171b}
.voicerow{display:flex;align-items:center;gap:8px}
.voicerow select{flex:1;min-width:0;padding:11px 10px;border-radius:10px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font:inherit;font-size:14px}
.rm{color:var(--warn);font-size:13px;padding:6px 8px}

/* Driving stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:12px;padding:9px 10px;text-align:center}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.stat.fast{background:#4a1c14}
.stat.fast .v{color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<div id="sign" hidden role="status" aria-live="polite">
  <div class="icon" id="signIcon"></div>
  <div class="txt"><div class="dist" id="signDist"></div><div class="instr" id="signInstr"></div></div>
</div>
<div id="limitSign" hidden aria-label="Speed limit"></div>

<button class="fab" id="locateBtn" aria-label="Show my location">
  <svg class="i" viewBox="0 0 24 24"><path d="M12 3 20 20 12 16 4 20z" transform="rotate(45 12 12)"/></svg>
</button>
<button class="fab" id="recenter" hidden aria-label="Re-centre">
  <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
</button>
<div id="toast" hidden></div>

<div id="sheet">
  <button id="grab" aria-label="Show or hide the panel"><span></span></button>
  <div class="panes" id="panes">

    <!-- GO -->
    <section data-pane="go">
      <form id="searchForm" class="search" autocomplete="off" role="search">
        <svg class="i lens" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="addr" type="search" enterkeyhint="search">
        <button class="clr" id="clearAddr" type="button" hidden aria-label="Clear">×</button>
      </form>
      <div class="list" id="results" hidden style="margin-top:8px"></div>

      <div class="card" id="destCard" hidden>
        <div class="top">
          <div class="meta"><h3 id="destName"></h3><small id="destSub"></small></div>
          <button class="x" id="destClose" type="button" aria-label="Close">×</button>
        </div>
        <div id="destBody"></div>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="car"><svg class="i" viewBox="0 0 24 24"><path d="M5 16v-4l2-5h10l2 5v4M4 16h16M6 16v2.5M18 16v2.5M5 12h14"/></svg><span data-t="car"></span></button>
          <button type="button" data-mode="pt"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 17.5V20M16 17.5V20"/></svg><span data-t="pt"></span></button>
        </div>
        <div id="carBox">
          <div class="eta wait" id="destEta"></div>
          <div class="actions"><button class="btn primary" id="goBtn" type="button" data-t="go"></button></div>
        </div>
        <div id="ptBox" hidden>
          <div class="ptwhen">
            <select id="ptWhen" aria-label="When">
              <option value="now" data-t="leaveNow"></option>
              <option value="dep" data-t="leaveAt"></option>
              <option value="arr" data-t="arriveBy"></option>
            </select>
            <input type="time" id="ptTime" hidden aria-label="Time">
          </div>
          <div class="list" id="ptList"></div>
          <p class="ptnote" data-th="ptCredit"></p>
        </div>
        <div class="chips">
          <button class="chip" id="favBtn" type="button"></button>
          <button class="chip" data-save="home" type="button" data-t="setHome"></button>
          <button class="chip" data-save="work" type="button" data-t="setWork"></button>
          <a class="chip" id="gmaps" target="_blank" rel="noopener">Google Maps</a>
        </div>
      </div>

      <div class="chips" id="places" style="margin-top:10px"></div>

      <div class="sub"><span data-t="nearby"></span></div>
      <div class="cats" id="cats"></div>
      <div id="nearWrap" hidden>
        <div class="sub"><span id="nearTitle"></span><button type="button" id="nearClose" data-t="clear"></button></div>
        <div class="list" id="nearList"></div>
      </div>

      <div id="recentWrap" hidden>
        <div class="sub"><span data-t="recent"></span><button type="button" id="recentClear" data-t="clear"></button></div>
        <div class="list" id="recent"></div>
      </div>
      <p class="note" data-t="longpress"></p>
    </section>

    <!-- EXPLORE -->

  route.pts = coords.map(([lon,lat]) => ({lat, lon, ...pxy(route.o,lat,lon)}));
  route.cum = [0];
  for(let i=1;i<route.pts.length;i++){ const a=route.pts[i-1], b=route.pts[i]; route.cum.push(route.cum[i-1] + Math.hypot(b.x-a.x, b.y-a.y)); }
  route.total = route.cum[route.cum.length-1];
}
function projectSeg(route, p, i){
  const a=route.pts[i], b=route.pts[i+1], dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy;
  const tt = L2 ? Math.max(0, Math.min(1, ((p.x-a.x)*dx + (p.y-a.y)*dy)/L2)) : 0;
  return {d:Math.hypot(p.x-(a.x+tt*dx), p.y-(a.y+tt*dy)), along:route.cum[i] + tt*Math.sqrt(L2), seg:i};
}
// Nearest point on the route between two segment indexes. Earlier segments win near-ties,
// so roads a route drives twice resolve to the next pass, not a later one.
function nearest(route, p, from, to, stopBelow){
  let best=null; const n=route.pts.length-2;
  for(let i=Math.max(0,from); i<=Math.min(n,to); i++){
    const r=projectSeg(route,p,i);
    if(!best || r.d < best.d - 0.5) best=r;
    if(stopBelow && r.d < stopBelow) return r;
  }
  return best || {d:Infinity, along:0, seg:0};
}
function pointAt(route, along){
  const c=route.cum; let lo=0, hi=c.length-1;
  along=Math.max(0, Math.min(route.total, along));
  while(hi-lo>1){ const m=(lo+hi)>>1; if(c[m]<=along) lo=m; else hi=m; }
  const a=route.pts[lo], b=route.pts[Math.min(lo+1,route.pts.length-1)], seg=(c[hi]-c[lo])||1, f=(along-c[lo])/seg;
  return {lat:a.lat+(b.lat-a.lat)*f, lon:a.lon+(b.lon-a.lon)*f, heading:(Math.atan2(b.x-a.x, b.y-a.y)/RAD+360)%360};
}

// Turn instructions from OSRM steps (English and Polish)
// =====================================================================
const MOD_DEG = {"straight":0,"slight right":40,"right":90,"sharp right":135,"uturn":180,"sharp left":-135,"left":-90,"slight left":-40};
const TURN_EN = {"left":"Turn left","right":"Turn right","slight left":"Bear left","slight right":"Bear right","sharp left":"Turn sharp left","sharp right":"Turn sharp right","straight":"Go straight on","uturn":"Make a U-turn"};
const TURN_PL = {"left":"Skręć w lewo","right":"Skręć w prawo","slight left":"Odbij lekko w lewo","slight right":"Odbij lekko w prawo","sharp left":"Skręć ostro w lewo","sharp right":"Skręć ostro w prawo","straight":"Jedź prosto","uturn":"Zawróć"};
const ORD_PL = ["","pierwszym","drugim","trzecim","czwartym","piątym","szóstym","siódmym","ósmym","dziewiątym"];
const ordEn = n => n + (["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10)]||"th");
function describe(step, isFinal){
  const m=step.maneuver, mod=m.modifier||"straight", nm=step.name||step.ref||"", deg=MOD_DEG[mod]||0;
  const arrow = text => ({text, icon:"arrow", deg});
  if(lang==="pl"){
    const onto = nm ? ` w ${nm}` : "", side = /left/.test(mod) ? "lewej" : /right/.test(mod) ? "prawej" : "środka";
    switch(m.type){
      case "depart": return {text: nm ? `Jedź ulicą ${nm}` : "Ruszaj", icon:"arrow", deg:0};
      case "arrive": return isFinal ? {text:"Meta: koniec trasy", icon:"flag"} : null;
      case "roundabout": case "rotary":
        return m.exit ? {text:`Na rondzie zjedź ${ORD_PL[m.exit]||m.exit+"."} zjazdem${onto}`, icon:"rb", exit:m.exit}
                      : {text:`Przejedź przez rondo${onto}`, icon:"rb", exit:""};
      case "roundabout turn": return {text:`Na rondzie ${lc(TURN_PL[mod]||"jedź dalej")}${onto}`, icon:"rb", exit:""};
      case "exit roundabout": case "exit rotary": return null;
      case "fork": return arrow(`Trzymaj się ${side}${onto}`);
      case "merge": return arrow(`Włącz się do ruchu${onto}`);
      case "on ramp": case "off ramp": return arrow(`Zjedź ${/left/.test(mod)?"w lewo":"w prawo"}${onto}`);
      case "turn": case "end of road": return arrow(`${TURN_PL[mod]||"Jedź dalej"}${onto}`);
      default: return mod==="straight" ? null : arrow(`${TURN_PL[mod]||"Jedź dalej"}${onto}`);
    }
  }
  const onto = nm ? ` onto ${nm}` : "";
  switch(m.type){
    case "depart": return {text:`Head off${nm?" along "+nm:""}`, icon:"arrow", deg:0};
    case "arrive": return isFinal ? {text:"Finish: you're back at the end of the route", icon:"flag"} : null;
    case "roundabout": case "rotary":
      return m.exit ? {text:`At the roundabout, take the ${ordEn(m.exit)} exit${onto}`, icon:"rb", exit:m.exit}
                    : {text:`Go through the roundabout${onto}`, icon:"rb", exit:""};
    case "roundabout turn": return {text:`At the roundabout, ${(TURN_EN[mod]||"continue").toLowerCase()}${onto}`, icon:"rb", exit:""};
    case "exit roundabout": case "exit rotary": return null;
    case "fork": return arrow(`Keep ${mod.replace("slight ","")}${onto}`);
    case "merge": return arrow(`Merge ${mod.replace("slight ","")}${onto}`);
    case "on ramp": case "off ramp": return arrow(`Take the slip road ${mod.replace("slight ","")}${onto}`);
    case "turn": case "end of road": return arrow(`${TURN_EN[mod]||"Continue"}${onto}`);
    default: return mod==="straight" ? null : arrow(`${TURN_EN[mod]||"Continue"}${onto}`);
  }
}
function iconSvg(ins){
  if(!ins) return "";
  if(ins.icon==="rb") return `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="5"/><text x="24" y="30" text-anchor="middle" font-size="17" font-weight="700" font-family="Barlow Semi Condensed,sans-serif" fill="currentColor">${ins.exit||""}</text></svg>`;
  if(ins.icon==="flag") return `<svg viewBox="0 0 48 48"><path d="M12 6v36" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M14 8h22l-5 7 5 7H14z" fill="currentColor"/></svg>`;
  if(ins.icon==="warn") return `<svg viewBox="0 0 48 48"><path d="M24 6 44 40H4z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M24 18v10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="34" r="2.5" fill="currentColor"/></svg>`;
  return `<svg viewBox="0 0 48 48" style="transform:rotate(${ins.deg||0}deg)"><path d="M24 4 39 21H29v23H19V21H9z" fill="currentColor"/></svg>`;
}
function prepareSteps(route, osrm){
  route.steps=[]; let seg=0;
  const legs=osrm.legs||[];
  legs.forEach((leg, li) => leg.steps.forEach(step => {
    if(step.maneuver.type==="depart" && li>0) return;
    const ins=describe(step, li===legs.length-1);
    if(!ins) return;
    const [lon,lat]=step.maneuver.location;
    const r=nearest(route, pxy(route.o,lat,lon), seg, route.pts.length, 2);
    seg=r.seg; route.steps.push({...ins, along:r.along});
  }));
  seg=0;
  route.stopAlong=(osrm.waypoints||[]).map(w => { const r=nearest(route, pxy(route.o,w.location[1],w.location[0]), seg, route.pts.length, 3); seg=r.seg; return r.along; });
}

async function osrmFetch(coords, signal){
  const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`, {signal});
  if(!res.ok) throw new Error("routing "+res.status);
  const j = await res.json();
  if(j.code!=="Ok" || !j.routes || !j.routes.length) throw new Error(j.code||"no route");
  return {route:j.routes[0], waypoints:j.waypoints};
}
function applyOsrm(route, data){
  route.raw = data;
  buildGeom(route, data.route.geometry.coordinates);
  prepareSteps(route, {legs:data.route.legs, waypoints:data.waypoints});
  route.duration = data.route.duration;
  route.ok = true;
  if(route.isDest) finalizeDest(route);
}
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
async function overpass(q, signal){
  let lastErr;
  for(const ep of OVERPASS){
    try{
      const res = await fetch(ep, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}, signal});
      if(res.ok) return await res.json();
      lastErr = new Error("overpass "+res.status);
    }catch(e){ if(e.name==="AbortError") throw e; lastErr=e; }
  }
  throw lastErr || new Error("overpass");
}
const IE_BBOX = "-10.8,51.3,-5.3,55.5";
function photonPlace(f){
  const p=f.properties||{}, [lon,lat]=f.geometry.coordinates;
  const street=[p.housenumber, p.street].filter(Boolean).join(" ");
  const label = p.name || street || p.city || "?";
  const area = [p.name ? street : "", p.district || p.locality, p.city || p.town || p.village, p.county].filter(Boolean);
  const kind = p.osm_value && p.osm_value!=="yes" ? p.osm_value.replace(/_/g," ") : "";
  return {lat, lon, label, sub:[...new Set(area)].slice(0,3).join(", ") || kind, kind};
}
async function searchPlaces(q, signal){
  const c = biasPoint();
  try{
    const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&lang=en&lat=${c.lat}&lon=${c.lon}&bbox=${IE_BBOX}`, {signal});
    if(!res.ok) throw new Error("photon "+res.status);
    const j = await res.json();
    return (j.features||[]).map(photonPlace);
  }catch(e){
    if(e.name==="AbortError") throw e;
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=ie,gb&viewbox=-10.8,55.5,-5.3,51.3&q=${encodeURIComponent(q)}`, {signal, headers:{"Accept-Language":"en"}});
    const list = await res.json();
    return list.map(x => { const parts=x.display_name.split(", "); return {lat:+x.lat, lon:+x.lon, label:parts[0], sub:parts.slice(1,4).join(", ")}; });
  }
}
async function reverseLabel(lat, lon){
  try{
    const res = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}&lang=en&limit=1`);
    const j = await res.json(); const f=(j.features||[])[0];
    return f ? photonPlace(f) : null;
  }catch(e){ return null; }
}

let nearCat=null, nearResults=[], nearCtl=null, nearMeta=null;
function renderCats(){ $("cats").innerHTML = CATS.map(c => `<button class="cat ${nearCat===c?"on":""}" type="button" data-cat="${c.k}">${ico(c.ic)}${t("cat_"+c.k)}</button>`).join(""); }
$("cats").addEventListener("click", e => { const b=e.target.closest("[data-cat]"); if(b) nearby(CATS.find(c => c.k===b.dataset.cat)); });
function osmPlace(e, cat){
  const tg=e.tags||{}, lat=e.lat ?? (e.center&&e.center.lat), lon=e.lon ?? (e.center&&e.center.lon);
  const street=[tg["addr:housenumber"], tg["addr:street"]].filter(Boolean).join(" ");
  const area=tg["addr:suburb"]||tg["addr:city"]||tg["addr:town"]||tg["addr:village"];
  const brand = tg.name && tg.brand && tg.brand!==tg.name ? tg.brand : "";
  return {lat, lon, label:tg.name||tg.brand||tg.operator||t("one_"+cat.k), sub:[street, area].filter(Boolean).join(", ") || brand || t("one_"+cat.k),
    kind:t("one_"+cat.k), hours:tg.opening_hours, phone:tg.phone||tg["contact:phone"], web:tg.website||tg["contact:website"], ic:cat.ic, cat:cat.k};
}
function renderNear(){
  if(!nearCat) return;
  if(!nearMeta){ $("nearTitle").textContent = t("nearSearching", {c:t("cat_"+nearCat.k)}); return; }
  if(nearMeta.err){ $("nearTitle").textContent = t("cat_"+nearCat.k); $("nearList").innerHTML = `<div class="empty">${t("nearFail")}</div>`; return; }
  $("nearTitle").textContent = t("nearWithin", {c:t("cat_"+nearCat.k), r:num(nearMeta.radius, nearMeta.radius%1?1:0)}) + (nearMeta.fromHere ? "" : t("nearMapCentre"));
  $("nearList").innerHTML = nearResults.length
    ? nearResults.map((p,i) => `<button class="item" type="button" data-n="${i}"><span class="ico">${ico(p.ic)}</span>
        <span class="meta"><b>${esc(p.label)}</b><small>${esc(p.hours ? p.hours : p.sub)}</small></span><span class="far">${fmtDist(p.d)}</span></button>`).join("")
    : `<div class="empty">${t("nearNone")}</div>`;
}
async function nearby(cat){
  nearCat = cat; nearMeta = null; renderCats();
  $("nearWrap").hidden=false; $("nearList").innerHTML=""; renderNear();
  if(nearCtl) nearCtl.abort(); nearCtl = new AbortController(); const ctl=nearCtl;
  const c = freshHere() ? here : await new Promise(res => locate(h => res(h || biasPoint()), true));
  const fromHere = !!(here && c===here);
  const ask = R => overpass(`[out:json][timeout:20];(${cat.q.map(f => `nwr${f}(around:${R},${c.lat},${c.lon});`).join("")});out center tags 80;`, ctl.signal);
  try{
    let j = await ask(2500), radius = 2.5;
    if((j.elements||[]).length < 4){ j = await ask(8000); radius = 8; }
    if(ctl!==nearCtl) return;
    nearResults = (j.elements||[]).map(e => osmPlace(e, cat)).filter(p => p.lat!=null)
      .map(p => ({...p, d:hav(c.lat,c.lon,p.lat,p.lon)})).sort((a,b) => a.d-b.d).slice(0,25);
    nearMeta = {radius, fromHere}; renderNear();
    drawNearMarkers(true);
  }catch(e){ if(e.name!=="AbortError"){ nearMeta = {err:true}; renderNear(); } }
}
function drawNearMarkers(fit){
  poiLayer.clearLayers(); if(tab!=="go" || !nearResults.length) return;
  const pts=[];
  nearResults.forEach(p => {
    L.marker([p.lat,p.lon], {keyboard:false, icon:L.divIcon({className:"", iconSize:[26,26], iconAnchor:[13,13], html:`<div class="poi">${ico(p.ic)}</div>`})})
      .on("click", () => openPlace(p)).addTo(poiLayer);
    pts.push([p.lat,p.lon]);
  });
  if(fit){ if(here) pts.push([here.lat,here.lon]); fitTo(L.latLngBounds(pts)); }
}
$("nearList").addEventListener("click", e => { const b=e.target.closest("[data-n]"); if(b) openPlace(nearResults[+b.dataset.n]); });
$("nearClose").onclick = () => { nearResults=[]; nearCat=null; nearMeta=null; $("nearWrap").hidden=true; poiLayer.clearLayers(); renderCats(); };

// Public transport (Transitous / MOTIS journey planner)
// =====================================================================
let ptData=null, ptSel=0, ptCtl=null, ptState=null, ptVer=store.get("ttr-ptver", null);
const PT_VERS = ["v5","v4","v6","v3","v2","v1"];
function legKind(m){
  m = m || "";
  if(m==="WALK") return "walk";
  if(/TRAM|FUNICULAR|CABLE|AERIAL/.test(m)) return "tram";
  if(/RAIL|SUBURBAN|SUBWAY|METRO|LONG_DISTANCE/.test(m)) return "rail";
  if(m==="FERRY") return "ferry";
  if(/BIKE|RENTAL/.test(m)) return "bike";
  if(m==="CAR") return "car";
  return "bus";
}
const KIND_COL = {bus:["#f2c230","#14171b"], tram:["#3ccf7a","#14171b"], rail:["#4cc3ff","#14171b"], ferry:["#4c8dff","#fff"], bike:["#b48cff","#14171b"], car:["#9ba6b2","#14171b"]};
function legColor(l){
  const k=legKind(l.mode);
  if(l.routeColor && /^[0-9a-f]{6}$/i.test(l.routeColor)) return ["#"+l.routeColor, l.routeTextColor && /^[0-9a-f]{6}$/i.test(l.routeTextColor) ? "#"+l.routeTextColor : "#fff"];
  return KIND_COL[k] || KIND_COL.bus;
}
function legName(l){
  const k=legKind(l.mode);
  let n = l.routeShortName || l.displayName || l.tripShortName || "";
  if(k==="tram" && /luas/i.test(l.agencyName||"") && !/luas/i.test(n)) n = "Luas " + n;
  if(!n && k==="rail" && l.agencyName) n = /irish rail|iarnr/i.test(l.agencyName) ? t("mode_rail") : l.agencyName;
  return (n || t("mode_"+k)).trim();
}
function decodePoly(str, prec){
  const f=Math.pow(10, prec||6); let i=0, lat=0, lon=0; const out=[];
  while(i<str.length){
    let b, s=0, r=0; do{ b=str.charCodeAt(i++)-63; r+=(b&31)*Math.pow(2,s); s+=5; }while(b>=32); lat += (r%2) ? -(r+1)/2 : r/2;
    s=0; r=0;      do{ b=str.charCodeAt(i++)-63; r+=(b&31)*Math.pow(2,s); s+=5; }while(b>=32); lon += (r%2) ? -(r+1)/2 : r/2;
    out.push([lat/f, lon/f]);
  }
  return out;
}
function legPoints(l){
  const g=l.legGeometry;
  if(g && g.points) return decodePoly(g.points, g.precision || (ptVer==="v1" ? 7 : 6));
  return [[l.from.lat,l.from.lon],[l.to.lat,l.to.lon]];
}
async function transitPlan(from, to, signal){
  const when=$("ptWhen").value, tv=$("ptTime").value;
  let time=new Date(), arriveBy=false;
  if(when!=="now" && tv){
    const [h,m]=tv.split(":").map(Number); time.setHours(h,m,0,0);
    if(time.getTime() < Date.now()-5*60000) time.setDate(time.getDate()+1);
    arriveBy = when==="arr";
  }
  const qs = `fromPlace=${from.lat.toFixed(6)},${from.lon.toFixed(6)}&toPlace=${to.lat.toFixed(6)},${to.lon.toFixed(6)}&time=${encodeURIComponent(time.toISOString())}&arriveBy=${arriveBy}&detailedTransfers=true`;
  const order = ptVer ? [ptVer, ...PT_VERS.filter(v => v!==ptVer)] : PT_VERS;
  let lastErr = new Error("unavailable");
  for(const v of order){
    let res;
    try{ res = await fetch(`https://api.transitous.org/api/${v}/plan?${qs}`, {signal}); }
    catch(e){ if(e.name==="AbortError") throw e; throw new Error("unreachable"); }
    if(res.status===404 || res.status===400){ lastErr = new Error("http "+res.status); continue; }
    if(!res.ok) throw new Error("http "+res.status);
    const j = await res.json();
    if(ptVer!==v){ ptVer=v; store.set("ttr-ptver", v); }
    return j;
  }
  throw lastErr;
}
function ptSearch(){
  const r = dest; if(!r) return;
  if(ptCtl) ptCtl.abort(); ptCtl = new AbortController(); const ctl=ptCtl;
  ptData=null; ptSel=0; ptState="busy"; renderPt();
  withHere(async h => {
    if(dest!==r || ctl!==ptCtl) return;
    if(!h){ ptState="noloc"; renderPt(); return; }
    try{
      const j = await transitPlan(h, r.dest, ctl.signal);
      if(dest!==r || ctl!==ptCtl) return;
      const its = (j.itineraries||[]).filter(it => it.legs && it.legs.length);
      const direct = (j.direct||[]).filter(it => it.legs && it.legs.length && it.duration < 45*60).slice(0,1);
      ptData = [...its.sort((a,b) => new Date(a.startTime)-new Date(b.startTime)).slice(0,6), ...direct];
      ptState = ptData.length ? "ok" : "none"; ptSel = 0; renderPt();
      if(ptData.length && tab==="go" && !S) drawPt(ptData[0], true);
    }catch(e){ if(e.name!=="AbortError"){ ptState="fail"; renderPt(); } }
  });
}
function ptChips(it){
  const legs = it.legs.filter(l => legKind(l.mode)!=="walk" || l.duration >= 60);
  return legs.map(l => {
    const k=legKind(l.mode);
    if(k==="walk") return `<span class="lg walk">${ico("walk")}${Math.round(l.duration/60)}</span>`;
    const [bg,fg]=legColor(l);
    return `<span class="lg" style="background:${bg};color:${fg}">${ico(k)}${esc(legName(l))}</span>`;
  }).join("<i>›</i>");
}
function ptSteps(it){
  const rows = [];
  it.legs.forEach((l, i) => {
    const k=legKind(l.mode), last = i===it.legs.length-1;
    if(k==="walk"){
      if(l.duration < 60 && !last) return;
      const to = last ? destName(dest) : (l.to && l.to.name) || t("destination");
      rows.push(`<div class="st"><span class="dot walk"></span><div><b>${t("walkMin",{m:Math.max(1,Math.round(l.duration/60))})}</b><small>${esc(t("walkTo",{d:fmtDist(l.distance||0), s:to}))}</small></div></div>`);
      return;
    }
    const [bg]=legColor(l), n=(l.intermediateStops||[]).length+1;
    const extra = [l.headsign ? t("towards",{h:l.headsign}) : "", l.from.track ? t("platform",{p:l.from.track}) : ""].filter(Boolean).join(" · ");
    rows.push(`<div class="st"><span class="dot" style="background:${bg}"></span><div>
      <b>${hhmm(l.startTime)} · ${esc(legName(l))}${l.realTime?`<span class="live">${t("live")}</span>`:""}</b>
      <small>${esc(t("fromStop",{s:l.from.name||""}))}${extra?" · "+esc(extra):""}</small>
      <small>${esc(t("ride",{n, s:(l.to&&l.to.name)||"", t:hhmm(l.endTime)}))}</small></div></div>`);
  });
  rows.push(`<div class="st"><span class="dot" style="background:var(--blue)"></span><div><b>${t("arriveAt",{t:hhmm(it.endTime)})}</b><small>${esc(destName(dest))}</small></div></div>`);
  return `<div class="steps">${rows.join("")}</div>`;
}
function renderPt(){
  const box=$("ptList");
  if(!dest || travelMode!=="pt"){ box.innerHTML=""; return; }
  if(ptState==="busy"){ box.innerHTML = `<div class="empty">${t("ptSearching")}</div>`; return; }
  if(ptState==="noloc"){ box.innerHTML = `<div class="empty">${t("ptNoLoc")}</div>`; return; }
  if(ptState==="fail"){ box.innerHTML = `<div class="empty">${t("ptFail")}</div>`; return; }
  if(ptState==="none" || !ptData){ box.innerHTML = `<div class="empty">${t("ptNone")}</div>`; return; }
  box.innerHTML = ptData.map((it, i) => {
    const walkOnly = it.legs.every(l => legKind(l.mode)==="walk");
    const leave = Math.round((new Date(it.startTime) - Date.now())/60000);
    const sub = walkOnly ? t("walkOnly",{m:Math.round(it.duration/60)}) : `${t("changes",{n:it.transfers||0})} · ${t("leaveIn",{m:leave})}`;
    return `<button class="pt ${i===ptSel?"sel":""}" type="button" data-pt="${i}">
      <span class="ptt"><b>${hhmm(it.startTime)} → ${hhmm(it.endTime)}</b><span>${fmtDur(it.duration)}</span></span>
      <span class="ptc">${ptChips(it)}</span><small>${esc(sub)}</small></button>${i===ptSel ? ptSteps(it) : ""}`;
  }).join("");
}
function drawPt(it, fit){
  clearRoute(); const all=[];
  it.legs.forEach(l => {
    const pts = legPoints(l), k=legKind(l.mode), walk = k==="walk";
    if(pts.length<2) return;
    L.polyline(pts, {color:"#0b0d10", weight:walk?7:11, opacity:.6, lineJoin:"round"}).addTo(markLayer);
    L.polyline(pts, {color: walk ? "#c9d1da" : legColor(l)[0], weight:walk?4:6, dashArray: walk ? "1 8" : null, lineCap:"round", lineJoin:"round"}).addTo(markLayer);
    if(!walk) [l.from, l.to].forEach(s => L.circleMarker([s.lat,s.lon], {radius:6, color:"#101317", weight:2, fillColor:"#fff", fillOpacity:1}).bindTooltip(esc(s.name||""), {direction:"top"}).addTo(markLayer));
    all.push(...pts);
  });
  destMarker(dest.dest);
  if(fit && all.length) fitTo(L.latLngBounds(all), 16);
}
$("ptList").addEventListener("click", e => { const b=e.target.closest("[data-pt]"); if(!b) return; ptSel=+b.dataset.pt; renderPt(); drawPt(ptData[ptSel], true); });
$("ptWhen").onchange = () => {
  const now = $("ptWhen").value==="now"; $("ptTime").hidden = now;
  if(!now && !$("ptTime").value){ const d=new Date(Date.now()+30*60000); $("ptTime").value = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

$("mapStyle").addEventListener("click", e => { const b=e.target.closest("[data-style]"); if(b){ settings.mapStyle=b.dataset.style; saveSettings(); applyMapStyle(); } });
function renderSwitches(){ document.querySelectorAll("[data-set]").forEach(b => b.setAttribute("aria-checked", String(!!settings[b.dataset.set]))); }
document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { settings[b.dataset.set] = !settings[b.dataset.set]; saveSettings(); renderSwitches(); });
function renderSaved(){
  const rows = [];
  ["home","work"].forEach(k => { if(places[k]) rows.push(`<div class="item"><span class="ico">${ico(k)}</span><span class="meta"><b>${t(k)}</b><small>${esc(places[k].label)}</small></span><button class="rm" type="button" data-rmp="${k}">${t("remove")}</button></div>`); });
  favs.forEach((f,i) => rows.push(`<div class="item"><span class="ico">${ico("star")}</span><span class="meta"><b>${esc(f.label)}</b><small>${esc(view(f).sub||"")}</small></span><button class="rm" type="button" data-rmf="${i}">${t("remove")}</button></div>`));
  $("savedList").innerHTML = rows.join("") || `<div class="empty">${t("savedNone")}</div>`;
}

$("langSeg").addEventListener("click", e => { const b=e.target.closest("[data-lang]"); if(b && b.dataset.lang!==lang){ lang=settings.lang=b.dataset.lang; saveSettings(); applyLang(); } });

// ---------- Voice ----------
let voiceOn = store.get("ttr-voice", true), voice=null, voiceList=[];
function voiceScore(v){
  let s=0; const n=v.name;
  if(/natural|neural|premium|enhanced|wavenet|online/i.test(n)) s+=10;
  if(/google/i.test(n)) s+=4;
  if(!v.localService) s+=2;
  if(lang==="en"){ if(/en[-_]IE/i.test(v.lang)) s+=4; else if(/en[-_]GB/i.test(v.lang)) s+=3; else if(/en[-_](AU|NZ)/i.test(v.lang)) s+=1; }
  if(/compact|espeak|robot|novelty|whisper|zarvox|bells|trinoids|bad news|good news|bubbles|cellos|jester|organ|superstar|bahh|boing|albert|fred|junior|ralph|kathy/i.test(n)) s-=20;
  return s;
}
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const want = new RegExp("^"+lang, "i");
  voiceList = speechSynthesis.getVoices().filter(v => want.test(v.lang)).sort((a,b) => voiceScore(b)-voiceScore(a));
  const saved = store.get("ttr-voiceURI-"+lang, lang==="en" ? store.get("ttr-voiceURI", null) : null);
  voice = voiceList.find(v => v.voiceURI===saved) || voiceList[0] || null;
  $("voiceSel").innerHTML = voiceList.length
    ? voiceList.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name.replace(/^(Microsoft|Google|Apple)\s+/,""))} · ${esc(v.lang)}</option>`).join("")
    : `<option>${t("phoneDefault")}</option>`;
  if(voice) $("voiceSel").value = voice.voiceURI;
}
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = pickVoice;
$("voiceSel").onchange = e => { voice = voiceList.find(v => v.voiceURI===e.target.value) || voice; store.set("ttr-voiceURI-"+lang, voice && voice.voiceURI); };
$("testVoice").onclick = () => { const was=voiceOn; voiceOn=true; say(t("v_test"), true); voiceOn=was; };
const ORD_WORDS = ["","first","second","third","fourth","fifth","sixth","seventh","eighth"];
const ABBR = [[/\bInd Est\b/g,"Industrial Estate"],[/\bRd\b/g,"Road"],[/\bAve\b/g,"Avenue"],[/\bCres\b/g,"Crescent"],[/\bCt\b/g,"Court"],
  [/\bDr\b/g,"Drive"],[/\bPk\b/g,"Park"],[/\bGrv\b/g,"Grove"],[/\bSq\b/g,"Square"],[/\bLwr\b/g,"Lower"],[/\bUpr\b/g,"Upper"],
  [/\bSt\b(?=\s+[A-Z])/g,"Saint"],[/\bSt\b/g,"Street"],[/\bN\b/g,"North"],[/\bS\b/g,"South"],[/\bE\b/g,"East"],[/\bW\b/g,"West"]];
function spoken(text){
  let s = lang==="en" ? text.replace(/\b(\d)(st|nd|rd|th)\b/g, (m,d) => ORD_WORDS[+d] || m) : text;
  ABBR.forEach(([re,w]) => s = s.replace(re, w));
  return s.replace(/\b([RNM])(\d)(\d)(\d)\b/g, "$1 $2 $3 $4").replace(/\b([RNM])(\d{1,2})\b/g, "$1 $2");
}
function say(text, urgent){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  if(urgent) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken(text));
  if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang = lang==="pl" ? "pl-PL" : "en-IE";
  u.rate = 0.96; speechSynthesis.speak(u);
}
function setVoiceBtn(){ $("muteBtn").textContent = voiceOn ? t("voiceOn") : t("voiceOff"); }
$("muteBtn").onclick = () => { voiceOn=!voiceOn; store.set("ttr-voice", voiceOn); setVoiceBtn(); if(!voiceOn) speechSynthesis.cancel(); };

// ---------- Apply language everywhere ----------
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-th]").forEach(el => el.innerHTML = t(el.dataset.th));   // our own strings with links
  document.querySelectorAll("#langSeg [data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  $("addr").placeholder = t("search_ph");
  ROUTES.forEach(r => { if(r.raw) applyOsrm(r, r.raw); else if(r.ok===false) fallbackRoute(r); });
  if(dest && dest.raw && !S) applyOsrm(dest, dest.raw);
  renderCats(); renderNear(); renderPlaces(); renderRecent(); renderExplore(); renderRoutes(); renderSwitches(); setVoiceBtn(); pickVoice();
  renderDestCard(); renderPt();
  if(S) updateStats();
}

// =====================================================================
// Speed limits (OpenStreetMap maxspeed via Overpass)
// =====================================================================
const SL = {limit:null, lastAt:0, lastPos:null, busy:false};
function parseLimit(v){
  if(!v) return null; const m=String(v).match(/(\d+)\s*(mph)?/i); if(!m) return null;
  return {v:+m[1], u:m[2]?"mph":"km/h", kmh: m[2] ? +m[1]*1.609 : +m[1]};
}
function showLimit(){
  const el=$("limitSign"); el.hidden = !S || !settings.limits;
  el.classList.toggle("unknown", !SL.limit);
  el.innerHTML = SL.limit ? `<div>${SL.limit.v}${SL.limit.u==="mph"?"<small>mph</small>":""}</div>` : "–";
}
async function checkLimit(f, hdg){
  if(!settings.limits || SL.busy || Date.now()-SL.lastAt < 10000) return;
  if(SL.lastPos && hav(SL.lastPos.lat,SL.lastPos.lon,f.lat,f.lon) < 120) return;
  SL.busy=true; SL.lastAt=Date.now(); SL.lastPos={lat:f.lat, lon:f.lon};
  try{
    const j = await overpass(`[out:json][timeout:8];way(around:25,${f.lat},${f.lon})["highway"]["maxspeed"];out tags geom 8;`);
    const o = mkO(f.lat, f.lon); let best=null;
    for(const w of j.elements||[]){
      const g=w.geometry||[];
      for(let i=0;i<g.length-1;i++){
        const a=pxy(o,g[i].lat,g[i].lon), b=pxy(o,g[i+1].lat,g[i+1].lon), dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy||1;
        const tt=Math.max(0,Math.min(1,(-a.x*dx - a.y*dy)/L2)); let d=Math.hypot(a.x+tt*dx, a.y+tt*dy);
        if(hdg!=null){ const br=(Math.atan2(dx,dy)/RAD+360)%180, h=hdg%180, diff=Math.min(Math.abs(br-h), 180-Math.abs(br-h)); if(diff>35) d+=20; }
        if(!best || d<best.d) best={d, tags:w.tags};
      }
    }
    if(!S) return;
    const lim = best && best.d < 40 ? parseLimit(best.tags.maxspeed) : null;
    if(lim && (!SL.limit || lim.v!==SL.limit.v || lim.u!==SL.limit.u)){
      SL.limit = lim; showLimit();
      if(settings.limitVoice) say(t("v_limit", {n:lim.v, mph:lim.u==="mph"}));
    }
  }catch(e){} finally{ SL.busy=false; }
}

// =====================================================================
// Driving session
// =====================================================================
let S=null, watchId=null, simTimer=null, wakeLock=null, follow=true;
async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => { if(S && document.visibilityState==="visible") keepAwake(); });

function startSession(r, mode){
  if(!r || (!r.pts && !r.isDest)) return;
  if(r.isDest){ r.pts=null; clearRoute(); destMarker(r.dest); }
  else drawRoute(r, false);
  poiLayer.clearLayers();
  if(hereMarker){ hereMarker.remove(); hereMarker=null; }
  S = {route:r, mode, seg:0, progress:0, off:0, offSaid:false, said:{}, startedAt:Date.now(), finished:false, lastFix:null, routing:false, lastRoute:0, overN:0, lastWarn:0};
  SL.limit=null; SL.lastPos=null; SL.lastAt=0;
  $("sheet").classList.add("driving"); $("sheet").classList.remove("collapsed");
  $("driveView").hidden=false; $("sign").hidden=false; $("recenter").hidden=true; $("locateBtn").hidden=true;
  setVoiceBtn(); showLimit(); follow=true; keepAwake();
  try{ const de=document.documentElement; if(!document.fullscreenElement && de.requestFullscreen) de.requestFullscreen({navigationUI:"hide"}).catch(()=>{}); }catch(e){}
  map.setZoom(17);
  if(r.isDest){ showSign({icon:"arrow", deg:0}, "", false); $("signInstr").textContent = t("findingYou"); }
  else say(t("v_intro",{id:r.id, n:routeName(r), s:r.stops.length-2}) + (mode==="sim" ? t("v_introSim") : ""), true);
  updateStats();
  if(mode==="sim"){
    let along=0; const speed=3*11;
    simTimer = setInterval(() => {
      along += speed*0.25;
      const p = pointAt(r, along);
      onFix({lat:p.lat, lon:p.lon, heading:p.heading, speed:11, acc:5});
      if(along >= r.total){ clearInterval(simTimer); simTimer=null; }
    }, 250);
  } else {
    if(!("geolocation" in navigator)){ toast(t("noGeo")); return; }
    watchId = navigator.geolocation.watchPosition(
      pos => onFix({lat:pos.coords.latitude, lon:pos.coords.longitude, heading:pos.coords.heading, speed:pos.coords.speed, acc:pos.coords.accuracy}),
      err => toast(err.code===1 ? t("geoBlocked") : t("gpsWait"), 4000),
      {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
  }
}
function endSession(){
  if(watchId!=null) navigator.geolocation.clearWatch(watchId); watchId=null;
  if(simTimer) clearInterval(simTimer); simTimer=null;
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  if("speechSynthesis" in window) speechSynthesis.cancel();
  if(meMarker){ meMarker.remove(); meMarker=null; }
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
  const wasDest = S && S.route.isDest;
  S=null;
  $("sign").hidden=true; $("sign").classList.remove("off"); $("recenter").hidden=true; $("locateBtn").hidden=false; $("limitSign").hidden=true;
  $("sheet").classList.remove("driving"); $("driveView").hidden=true;
  renderRoutes();
  if(wasDest && dest){ dest.pts=null; dest.raw=null; dest.eta=null; renderEta(); }
  refreshMap();
}
$("endBtn").onclick = endSession;
map.on("dragstart", () => { if(S){ follow=false; $("recenter").hidden=false; } });
$("recenter").onclick = () => { follow=true; $("recenter").hidden=true; if(S && S.lastFix) map.setView([S.lastFix.lat,S.lastFix.lon], Math.max(map.getZoom(),16)); };

function showSign(ins, distText, off){
  $("signIcon").innerHTML = iconSvg(ins); $("signDist").textContent = distText; $("signInstr").textContent = ins && ins.text ? ins.text : "";
  $("sign").classList.toggle("off", !!off);
}

// Route from where you are to the chosen place (also used to reroute).
async function routeFromHere(f, isReroute){
  const r = S.route;
  if(S.routing || Date.now()-S.lastRoute < (isReroute ? 8000 : 4000)) return;
  S.routing = true; S.lastRoute = Date.now();
  if(isReroute) say(t("v_rerouting"), true);
  try{
    const data = await osrmFetch(`${f.lon},${f.lat};${r.dest.lon},${r.dest.lat}`);
    if(!S || S.route !== r) return;
    applyOsrm(r, data);
    drawRoute(r, false);
    S.seg=0; S.progress=0; S.said={}; S.off=0; S.offSaid=false;
    if(!isReroute){ map.setView([f.lat, f.lon], 17); say(t("v_heading", {n:destName(r), t:spokenDur(r.duration)}), true); }
    setTimeout(() => { if(S && S.route===r && S.lastFix) onFix({...S.lastFix, speed:null}); }, 0);   // update the sign right away
  }catch(e){ toast(t("routeFail"), 4000); }
  finally{ if(S) S.routing = false; }
}

function onFix(f){
  if(!S) return;
  const r=S.route;
  let hdg = (f.heading!=null && !isNaN(f.heading) && (f.speed||0)>1) ? f.heading : null;
  if(hdg==null && S.lastFix){ const d=hav(S.lastFix.lat,S.lastFix.lon,f.lat,f.lon); if(d>4){ const o=mkO(S.lastFix.lat,S.lastFix.lon), q=pxy(o,f.lat,f.lon); hdg=(Math.atan2(q.x,q.y)/RAD+360)%360; } }
  S.lastFix = {lat:f.lat, lon:f.lon};
  here = {lat:f.lat, lon:f.lon, at:Date.now()};
  if(!meMarker) meMarker = L.marker([f.lat,f.lon], {icon:meIcon(hdg), zIndexOffset:1000, keyboard:false}).addTo(map);
  else { meMarker.setLatLng([f.lat,f.lon]); meMarker.setIcon(meIcon(hdg)); }
  if(follow) map.panTo([f.lat,f.lon], {animate:true, duration:.4});

  // speed and limit
  const kmh = f.speed!=null && f.speed>=0 ? Math.round(f.speed*3.6) : null;
  $("spd").textContent = kmh==null ? "–" : kmh;
  const over = kmh!=null && SL.limit && kmh > SL.limit.kmh + 3;
  S.overN = over ? S.overN+1 : 0;
  $("spdBox").classList.toggle("fast", S.overN>=2);
  if(S.overN>=3 && settings.speedWarn && settings.limits && Date.now()-S.lastWarn > 30000){ S.lastWarn=Date.now(); say(t("v_check")); }
  checkLimit(f, hdg);

  if(r.isDest && !r.pts){ routeFromHere(f, false); return; }
  if(!r.pts) return;

  const p = pxy(r.o, f.lat, f.lon);
  let m = nearest(r, p, S.seg-3, S.seg+150);
  if(m.d > 40){ const g = nearest(r, p, S.seg, r.pts.length); if(g.d < m.d) m = g; }
  if(!r.isDest && S.progress < 30 && m.d > 60){
    showSign({icon:"flag"}, fmtDist(hav(f.lat,f.lon,r.pts[0].lat,r.pts[0].lon)), false); $("signInstr").textContent = t("toStart");
    updateStats(); return;
  }
  const leavingStart = r.isDest && S.progress < 20 && m.d <= 150;   // still in a car park or driveway
  if(m.d > 45 && !leavingStart){
    S.off++;
    if(S.off>=3 && r.isDest){
      showSign({icon:"warn"}, t("rerouting"), true); $("signInstr").textContent = t("newWay");
      routeFromHere(f, true); updateStats(); return;
    }
    if(S.off>=3){
      showSign({icon:"warn"}, t("offRoute"), true);
      $("signInstr").textContent = t("offRouteTxt", {d:fmtDist(m.d)});
      if(!S.offSaid){ say(t("v_off"), true); S.offSaid=true; }
      updateStats(); return;
    }
  } else {
    if(S.off>=3 && !r.isDest) say(t("v_back"), true);
    S.off=0; S.offSaid=false; S.seg=m.seg; S.progress=Math.max(S.progress, m.along);
  }
  if(doneLayer) doneLayer.setLatLngs(r.pts.slice(0, S.seg+1).map(q=>[q.lat,q.lon]).concat([[f.lat,f.lon]]));

  const idx = r.steps.findIndex(s => s.along > S.progress + 4);
  if(idx<0 || S.progress > r.total-25){ finish(); return; }
  const step = r.steps[idx], dist = step.along - S.progress;
  showSign(step, fmtDist(dist), false);
  const k = S.said[idx] || (S.said[idx] = {});
  const prevAlong = idx>0 ? r.steps[idx-1].along : 0;
  if(!k.km && dist <= 1100 && dist > 700 && (step.along - prevAlong) > 1500){ k.km=true; say(t("v_km", {s:lc(step.text)})); }
  if(!k.far && dist <= 220 && dist > 70 && (step.along - prevAlong) > 260){ k.far=true; say(t("v_in", {d:spokenDist(dist), s:lc(step.text)})); }
  if(!k.near && dist <= 45){
    k.near=k.far=true;
    if(step.icon==="flag") S.arrSaid = true;
    const next = r.steps[idx+1], soon = next && (next.along - step.along) < 120 && next.icon!=="flag";
    const now = step.icon==="flag" ? (r.isDest ? `${step.text}.` : t("v_end"))
      : step.icon==="rb" ? `${step.text}.` : t("v_now", {s:lc(step.text)});
    say(soon ? now + t("v_then", {s:lc(next.text)}) : now, true);
    if(soon) (S.said[idx+1] = S.said[idx+1] || {}).far = true;
  }
  updateStats();
}
function updateStats(){
  const r=S.route;
  $("midLabel").textContent = r.isDest ? t("minLeft") : t("stops");
  if(r.isDest){
    $("stopsDone").textContent = r.pts ? Math.max(0, Math.round(r.duration*(1-S.progress/r.total)/60)) : "–";
    $("left").textContent = r.pts ? num(Math.max(0,(r.total-S.progress)/1000),1) : "–";
    return;
  }
  const inner=(r.stopAlong||[]).slice(1,-1);
  $("stopsDone").textContent = `${inner.filter(a => a <= S.progress + 15).length}/${inner.length}`;
  $("left").textContent = num(Math.max(0,(r.total-S.progress)/1000),1);
  stopMarkers.forEach((mk,i) => {
    const el = mk && mk.getElement && mk.getElement();
    if(el && el.firstChild){ const a=r.stopAlong[i]; el.firstChild.classList.toggle("done", i>0 && a!=null && a <= S.progress+15 && i<r.stops.length-1); }
  });
}
function finish(){
  if(S.finished) return; S.finished=true;
  const mins = Math.round((Date.now()-S.startedAt)/60000);
  if(S.route.isDest){
    showSign({icon:"flag"}, t("arrived"), false);
    $("signInstr").textContent = `${destName(S.route)} · ${mins} min`;
    if(!S.arrSaid) say(t("v_arrived"), true);
  } else {
    showSign({icon:"flag"}, t("done"), false);
    $("signInstr").textContent = S.mode==="sim" ? t("rehDone") : t("routeDone", {id:S.route.id, m:mins});
    say(S.mode==="sim" ? t("v_reh") : t("v_done"), true);
    if(S.mode!=="sim"){ (log[S.route.id] = log[S.route.id]||[]).push({date:new Date().toISOString(), mins}); store.set("ttr-log", log); }
  }
  if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
}

// =====================================================================
// Boot
// =====================================================================
(async function boot(){
  practice = ROUTES.find(r => r.id===store.get("ttr-last", 1)) || ROUTES[0];
  applyMapStyle(); applyLang(); placeFabs();
  showTab(store.get("ttr-tab", "go"));
  try{
    const st = navigator.permissions && await navigator.permissions.query({name:"geolocation"});
    if(st && st.state==="granted") locate(h => { if(h){ renderExplore(); if(tab==="go" && !dest) map.setView([h.lat,h.lon], 14); } }, true);
  }catch(e){}
  let failed=0;
  for(const r of ROUTES){
    try{ await loadRoute(r); }catch(e){ failed++; fallbackRoute(r); }
    renderRoutes();
    if(r===practice && tab==="practice" && !S) drawRoute(r);
  }
  $("loadState").textContent = failed ? t("someOffline") : "";
})();
