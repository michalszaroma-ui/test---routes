<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Drive Ireland</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept: a car HUD. Dark glass panels float over a night map; one electric-cyan accent marks what's
   live or actionable; amber and red are reserved for warnings. Angular cut corners on primary
   controls echo instrument clusters. Dark-only on purpose: it's used in a car, often after dark. */
:root{
  --void:#05080f; --glass:rgba(10,16,28,.80); --glass-2:rgba(16,24,40,.86);
  --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.075); --edge:rgba(130,180,255,.14); --edge-2:rgba(130,180,255,.26);
  --text:#eaf2ff; --muted:#8a9bb6; --dim:#5d6d88;
  --cyan:#38e1ff; --cyan-ink:#02141b; --violet:#8f7cff; --amber:#ffb547; --red:#ff4f6d; --green:#33e3a1;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  --cut-s:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  --sl:max(12px,env(safe-area-inset-left,0px)); --sr:max(12px,env(safe-area-inset-right,0px));
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--text);font-family:var(--body);font-size:14.5px;letter-spacing:-.005em}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--edge)}

/* ---------- Map ---------- */
#map{position:fixed;inset:0;background:#0a0f18}
.leaflet-container{background:#0a0f18;font-family:var(--body)}
body[data-map="dark"] .leaflet-tile-pane{filter:saturate(1.15) brightness(1.08) hue-rotate(-8deg)}
.leaflet-control-attribution{background:rgba(5,8,15,.65)!important;color:var(--dim)!important;font-size:9.5px;backdrop-filter:blur(6px)}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-tooltip{background:var(--glass-2);color:var(--text);border:1px solid var(--edge-2);box-shadow:0 8px 24px rgba(0,0,0,.5);font-family:var(--body)}
.leaflet-tooltip-top:before{border-top-color:var(--edge-2)}
.glow{filter:blur(3px)}
.stopmk{width:28px;height:28px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:var(--cyan-ink);
  background:var(--c);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 0 6px var(--c))}
.stopmk.done{opacity:.3}
.stopmk.home{width:42px;height:22px;font-size:11px;letter-spacing:.08em;clip-path:var(--cut-s);background:var(--text)!important;color:var(--void)}
.pin svg{width:34px;height:44px;filter:drop-shadow(0 0 10px rgba(56,225,255,.6))}
.poi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);color:var(--amber);border:1.5px solid var(--amber);box-shadow:0 0 12px rgba(255,181,71,.35)}
.poi svg{width:15px;height:15px;stroke-width:2.2}
.poi.ex{color:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(51,227,161,.35)}
.poi.ex.t-heritage{color:var(--amber);border-color:var(--amber)}.poi.ex.t-coast,.poi.ex.t-view{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(56,225,255,.35)}
.hzm{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--glass-2);color:var(--c);border:1.5px solid var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}
.hzm svg{width:13px;height:13px;stroke-width:2.3}
.me svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(56,225,255,.8))}

/* ---------- Floating buttons ---------- */
.fabs{position:fixed;right:var(--sr);z-index:1000;display:grid;gap:10px}
.fab{width:48px;height:48px;display:grid;place-items:center;color:var(--text);background:var(--glass);border:1px solid var(--edge);border-radius:16px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab.on{color:var(--amber);border-color:rgba(255,181,71,.5);box-shadow:0 0 0 1px rgba(255,181,71,.25),0 10px 30px rgba(0,0,0,.45)}
#recenter{position:fixed;right:var(--sr);z-index:1000;color:var(--cyan)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 150px);z-index:1100;padding:10px 16px;font-size:13.5px;max-width:90vw;text-align:center;
  background:var(--glass-2);border:1px solid var(--edge-2);border-radius:12px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* ---------- HUD (driving) ---------- */
#hud{position:fixed;top:calc(var(--safe-t) + 10px);left:var(--sl);right:var(--sr);z-index:1000;display:grid;gap:8px}
.sign{display:flex;align-items:center;gap:14px;padding:14px 16px;clip-path:var(--cut);background:linear-gradient(135deg,rgba(14,26,44,.92),rgba(8,14,26,.9));
  border:1px solid var(--edge-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative}
.sign::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--cyan),transparent 70%)}
.sicon{flex:0 0 58px;height:58px;display:grid;place-items:center;color:var(--cyan);border-radius:50%;background:radial-gradient(circle,rgba(56,225,255,.16),transparent 70%)}
.sicon svg{width:48px;height:48px;filter:drop-shadow(0 0 8px rgba(56,225,255,.7))}
.stxt{min-width:0;flex:1}
.sdist{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sinstr{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15;margin-top:4px;text-wrap:balance}
.sthen{margin-top:6px;font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.sign.off .sicon,.sign.off .sdist{color:var(--red)}.sign.off::after{background:linear-gradient(90deg,var(--red),transparent 70%)}
.sign.off .sicon svg{filter:drop-shadow(0 0 8px rgba(255,79,109,.7))}
.alert{--c:var(--amber);display:flex;align-items:center;gap:10px;padding:9px 14px;clip-path:var(--cut-s);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 22%,rgba(8,14,26,.92)),rgba(8,14,26,.9));
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.alert .aic{color:var(--c);display:grid}
.alert .atx{flex:1;font-weight:600;font-size:14.5px}
.alert .ad{font-family:var(--display);font-size:20px;color:var(--c);font-variant-numeric:tabular-nums}
.alert.cam{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}}
#dial{position:fixed;left:var(--sl);z-index:1000;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(18,30,50,.94),rgba(6,10,18,.94));
  border:1px solid var(--edge-2);box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 0 22px rgba(56,225,255,.08)}
#dial svg{position:absolute;inset:0;width:100%;height:100%}
#dial circle{fill:none;stroke-width:7;transform:rotate(135deg);transform-origin:60px 60px;stroke-linecap:round}
#dial .trk{stroke:rgba(130,180,255,.13);stroke-dasharray:235.6 400}
#dial .arc{stroke:var(--cyan);stroke-dasharray:0 400;transition:stroke-dasharray .4s ease,stroke .2s;filter:drop-shadow(0 0 5px rgba(56,225,255,.8))}
#dial.over .arc{stroke:var(--red);filter:drop-shadow(0 0 6px rgba(255,79,109,.9))}
.dv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dv b{font-family:var(--display);font-weight:700;font-size:38px;line-height:.95;font-variant-numeric:tabular-nums}
#dial.over .dv b{color:var(--red)}
.dv span{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.limit{position:absolute;right:-12px;top:-8px;width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid #e3263f;display:grid;place-items:center;
  color:#0b0b0b;font-family:var(--display);font-weight:700;font-size:18px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.5);text-align:center}
.limit small{display:block;font-size:7px}
.limit.unknown{opacity:.4}

/* ---------- Bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;flex-direction:column;max-height:68vh;
  background:linear-gradient(180deg,rgba(13,20,34,.90),rgba(7,11,20,.95));backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);
  border-top:1px solid var(--edge-2);border-radius:24px 24px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.55)}
#sheet::before{content:"";position:absolute;left:18%;right:18%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.8}
#grab{display:block;width:100%;padding:9px 0 3px}
#grab span{display:block;width:40px;height:4px;border-radius:2px;background:var(--edge-2);margin:0 auto}
.panes{flex:1;min-height:0;overflow-y:auto;padding:6px var(--sr) 14px var(--sl);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.panes::-webkit-scrollbar{display:none}
#sheet.collapsed .panes{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px var(--sr) calc(var(--safe-b) + 6px) var(--sl);border-top:1px solid var(--edge)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:12px;transition:color .15s}
.tabs button[aria-selected="true"]{color:var(--cyan);background:rgba(56,225,255,.07)}
.tabs button[aria-selected="true"] svg.i{filter:drop-shadow(0 0 6px rgba(56,225,255,.7))}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
body.driving #grab,body.driving .panes,body.driving .tabs{display:none}
#driveView{padding:12px var(--sr) calc(var(--safe-b) + 12px) var(--sl)}

.kicker{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:6px 4px 2px}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0 4px 12px;letter-spacing:.01em;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-family:var(--display);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sub button{color:var(--cyan);font-size:11.5px;letter-spacing:.1em;font-family:var(--display);text-transform:uppercase}
.note{color:var(--dim);font-size:12px;line-height:1.5;margin:14px 4px 0;max-width:65ch}
.note a{color:var(--muted)}

/* Search */
.search{position:relative}
.search input{width:100%;padding:14px 42px 14px 46px;border-radius:16px;background:var(--card);color:var(--text);border:1px solid var(--edge);font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:none;border-color:rgba(56,225,255,.6);box-shadow:0 0 0 4px rgba(56,225,255,.1)}
.search input::-webkit-search-cancel-button{display:none}
.search .lens{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:20px;line-height:1}

/* Lists */
.list{display:grid;gap:6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid transparent;transition:background .15s,border-color .15s}
.item:active{background:var(--card-2)}
.item.sel{border-color:var(--c,var(--cyan));background:color-mix(in srgb,var(--c,var(--cyan)) 8%,transparent)}
.item .meta{min-width:0;flex:1}
.item b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .far{flex:0 0 auto;color:var(--muted);font-family:var(--display);font-size:13px;font-variant-numeric:tabular-nums}
.item .ico{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(56,225,255,.08);color:var(--cyan);border:1px solid rgba(56,225,255,.16)}
.item .ico svg{width:19px;height:19px}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;line-height:1.45}
.badge{flex:0 0 40px;height:40px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--cyan-ink);background:var(--c);clip-path:var(--cut-s)}
.score{flex:0 0 auto;min-width:44px;padding:5px 8px;text-align:center;font-family:var(--display);font-weight:700;font-size:16px;border-radius:10px;border:1px solid}
.s-a{color:var(--green);border-color:rgba(51,227,161,.45);background:rgba(51,227,161,.08)}
.s-b{color:var(--cyan);border-color:rgba(56,225,255,.45);background:rgba(56,225,255,.08)}
.s-c{color:var(--amber);border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.08)}
.s-d{color:var(--red);border-color:rgba(255,79,109,.45);background:rgba(255,79,109,.08)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-size:13px;font-weight:500;color:var(--text);text-decoration:none;white-space:nowrap}
.chip svg.i{width:16px;height:16px}
.chip.on{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink);box-shadow:0 0 16px rgba(56,225,255,.35)}
.chip.place{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--cyan);border-color:rgba(56,225,255,.3);background:rgba(56,225,255,.06)}

/* Nearby grid */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:16px;background:var(--card);font-size:12px;font-weight:500;color:var(--text);border:1px solid transparent;text-align:center;transition:border-color .15s,background .15s}
.cat .orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--cyan);
  background:radial-gradient(circle at 35% 30%,rgba(56,225,255,.28),rgba(143,124,255,.10) 60%,transparent 75%);border:1px solid rgba(56,225,255,.22)}
.cat .orb svg{width:20px;height:20px}
.cat.on{border-color:rgba(56,225,255,.55);background:rgba(56,225,255,.07)}

/* Place card */
.card{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,rgba(20,32,54,.75),rgba(10,16,28,.8));border:1px solid var(--edge-2);margin:12px 0 4px;box-shadow:0 0 0 1px rgba(56,225,255,.08),0 20px 40px rgba(0,0,0,.35)}
.hero{position:relative;height:168px;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(56,225,255,.07) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(56,225,255,.07) 23px 24px),linear-gradient(135deg,#0d1a2e,#120f2a);cursor:zoom-in}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .5s ease}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,16,28,.95));pointer-events:none}
.hero.none{display:none}
.hero.loading{height:110px;animation:shimmer 1.6s linear infinite;background-size:200% 100%,auto,auto,auto;
  background-image:linear-gradient(100deg,transparent 30%,rgba(56,225,255,.08) 50%,transparent 70%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(56,225,255,.06) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(56,225,255,.06) 23px 24px),linear-gradient(135deg,#0d1a2e,#120f2a)}
@keyframes shimmer{to{background-position:-200% 0,0 0,0 0,0 0}}
@keyframes fade{from{opacity:0}}
.hero .cred{position:absolute;right:10px;top:10px;z-index:1;display:inline-flex;align-items:center;gap:5px;max-width:70%;padding:4px 8px;border-radius:8px;background:rgba(5,8,15,.6);color:var(--muted);font-size:10.5px;backdrop-filter:blur(8px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .cred svg{width:13px;height:13px}
.cbody{padding:14px 16px 16px}
.hero:not(.none) + .cbody{margin-top:-46px;position:relative;z-index:1}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .top .meta{min-width:0;flex:1}
.card h3{margin:0;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.08;text-wrap:balance;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.card .top small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.card .x{flex:0 0 34px;height:34px;border-radius:12px;background:rgba(5,8,15,.55);border:1px solid var(--edge);color:var(--muted);font-size:20px;line-height:1;backdrop-filter:blur(8px)}
.card p{margin:12px 0 0;line-height:1.55;font-size:13.5px;color:#c9d6ea;max-width:65ch}
.gal{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal button{flex:0 0 84px;height:62px;border-radius:10px;background:#0d1a2e center/cover no-repeat;border:1px solid var(--edge);cursor:zoom-in}
.trail{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.trail span{padding:5px 10px;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.03em;color:var(--green);background:rgba(51,227,161,.08);border:1px solid rgba(51,227,161,.25);clip-path:var(--cut-s)}
.info{margin-top:12px;display:grid;gap:6px;font-size:13.5px}
.info div{display:flex;gap:10px;min-width:0}
.info span{flex:0 0 62px;color:var(--dim);font-family:var(--display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;padding-top:2px}
.info a,.info em{min-width:0;overflow-wrap:anywhere;font-style:normal}
.eta{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--cyan)}
.eta b{font-family:var(--display);font-weight:700;font-size:26px;line-height:1}
.eta span{color:var(--muted);font-family:var(--display);font-size:15px}
.eta svg{filter:drop-shadow(0 0 6px rgba(56,225,255,.6))}
.eta.wait{color:var(--muted);font-size:13.5px}
.tdelay{margin-left:auto;padding:4px 9px;border-radius:8px;font-style:normal;font-size:12px;font-weight:600;color:var(--green);background:rgba(51,227,161,.1);border:1px solid rgba(51,227,161,.3)}
.tdelay.bad{color:var(--amber);background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.35)}
.incs{display:grid;gap:6px;margin-top:12px}
.incs .ph{margin:0 2px}
.inc{--c:var(--amber);display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.inc > svg{color:var(--c);width:20px;height:20px}
.inc div{min-width:0;flex:1}
.inc b{display:block;font-size:13.5px;font-weight:600}
.inc small{display:block;color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inc span{font-family:var(--display);font-weight:700;color:var(--c);font-size:14px;white-space:nowrap}
.keyrow{display:flex;gap:8px;margin-top:10px}
.keyrow input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;background:rgba(5,8,15,.5);color:var(--text);border:1px solid var(--edge);font:inherit;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
.keyrow input:focus{outline:none;border-color:rgba(56,225,255,.6)}
.keyfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.kstat{color:var(--muted)}.kstat.ok{color:var(--green)}.kstat.bad{color:var(--red)}
.keyfoot a{color:var(--cyan)}
.card .chips{margin-top:12px}

/* Segmented controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--edge);margin-bottom:6px}
.card .seg{margin:14px 0 0}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.seg button svg.i{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:rgba(56,225,255,.14);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(56,225,255,.4)}

/* Public transport */
.ptwhen{display:flex;gap:8px;margin-top:12px}
.ptwhen select,.ptwhen input{min-width:0;padding:10px 12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--edge);font:inherit;font-size:14px}
.ptwhen select{flex:1}
.ptwhen input{flex:0 0 112px}
#ptList{margin-top:10px}
.pt{display:block;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:1px solid transparent}
.pt.sel{border-color:rgba(56,225,255,.5);background:rgba(56,225,255,.06)}
.pt .ptt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pt .ptt b{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pt .ptt span{color:var(--cyan);font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.ptc{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px}
.ptc i{color:var(--dim);font-style:normal;font-size:13px}
.lg{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:7px;font-family:var(--display);font-size:13px;font-weight:700;line-height:1.2}
.lg svg.i{width:15px;height:15px;stroke-width:2.2}
.lg.walk{background:transparent;color:var(--muted);padding:3px 2px;font-weight:600}
.pt small{display:block;color:var(--muted);font-size:12.5px;margin-top:7px}
.steps{margin:8px 0 4px;padding:6px 4px 2px 8px}
.st{display:flex;gap:12px;position:relative;padding-bottom:12px}
.st:not(:last-child)::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--edge-2)}
.st .dot{flex:0 0 14px;height:14px;border-radius:50%;margin-top:3px;border:2px solid var(--void);box-shadow:0 0 0 2px var(--edge-2);position:relative;z-index:1}
.st .dot.walk{background:var(--card-2)}
.st div{min-width:0;flex:1}
.st b{display:block;font-weight:600;font-size:14px}
.st small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.live{display:inline-block;padding:0 6px;border-radius:4px;background:var(--green);color:#03130c;font-family:var(--display);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-left:6px;vertical-align:1px}
.ptnote{color:var(--dim);font-size:11.5px;line-height:1.45;margin:10px 2px 0}
.ptnote a{color:var(--muted)}

/* Buttons */
.actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:15px 14px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;clip-path:var(--cut);transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#5ef0ff,var(--cyan) 55%,#29b8e6);color:var(--cyan-ink);filter:drop-shadow(0 0 14px rgba(56,225,255,.45))}
.btn.ghost{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--edge-2)}
.btn.danger{background:rgba(255,79,109,.14);color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,79,109,.5)}
.btn.small{flex:0 0 auto;padding:12px 18px;font-size:13px}
.btn.icon{flex:0 0 58px;display:grid;place-items:center;padding:0}
.btn.icon.off{color:var(--dim)}
.btn:disabled{opacity:.35;filter:none}
.link{display:inline-flex;align-items:center;gap:8px;margin:12px 4px 0;color:var(--cyan);font-weight:600;font-size:13.5px}
.link svg{width:18px;height:18px}

/* Explore cards */
.ex{display:flex;gap:12px;width:100%;text-align:left;padding:10px;border-radius:18px;background:var(--card);border:1px solid transparent}
.ex:active{background:var(--card-2)}
.thumb{flex:0 0 78px;height:78px;border-radius:14px;display:grid;place-items:center;background:#0d1a2e center/cover no-repeat;color:var(--dim);border:1px solid var(--edge);transition:filter .3s}
.thumb.has svg{display:none}
.thumb.t-walk{color:rgba(51,227,161,.5)}.thumb.t-heritage{color:rgba(255,181,71,.5)}.thumb.t-coast,.thumb.t-view{color:rgba(56,225,255,.5)}
.exm{min-width:0;flex:1;padding-top:2px}
.ex .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex b{font-weight:600;font-size:15px;line-height:1.25}
.ex .far{color:var(--muted);font-family:var(--display);font-size:13px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.ex small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.ex p{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:#b5c3d9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:1px 7px;font-family:var(--display);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-right:6px;clip-path:var(--cut-s)}
.tag.walk{background:rgba(51,227,161,.16);color:var(--green)}.tag.coast,.tag.view{background:rgba(56,225,255,.14);color:var(--cyan)}.tag.heritage{background:rgba(255,181,71,.15);color:var(--amber)}

/* Test tab */
.route .badge{--c:inherit}
.intel{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ichip{--c:var(--cyan);display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:500;color:var(--text);
  background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.ichip svg{width:15px;height:15px;color:var(--c)}
.rsheet{margin-top:10px;padding:6px 4px;display:grid;gap:2px}
.rs{display:flex;gap:12px;align-items:center;padding:7px 6px;border-radius:12px}
.rs:nth-child(odd){background:rgba(255,255,255,.02)}
.rsi{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--cyan);background:rgba(56,225,255,.08);border:1px solid rgba(56,225,255,.2)}
.rsi svg{width:18px;height:18px}
.rsi.rb b{font-family:var(--display);font-size:15px;width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;line-height:1}
.rsi.hz{--c:var(--amber);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.rsi.lim{background:#fff;border:3px solid #e3263f;border-radius:50%;color:#111}
.rsi.lim b{font-family:var(--display);font-size:13px}
.rs div{min-width:0;flex:1}
.rs b{display:block;font-weight:600;font-size:13.5px}
.rs b.dim{font-weight:500;color:#c9d6ea}
.rs small{color:var(--dim);font-family:var(--display);font-size:12px}
.pgroup{display:grid;gap:6px;margin-bottom:12px}
.ph{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 4px 2px}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border-radius:14px;background:var(--card);border:1px solid transparent}
.chk .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--edge-2);display:grid;place-items:center;color:transparent;margin-top:1px;transition:all .15s}
.chk .box svg{width:16px;height:16px;stroke-width:2.6}
.chk.on .box{background:var(--green);border-color:var(--green);color:#03130c;box-shadow:0 0 12px rgba(51,227,161,.4)}
.chk.on b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(138,155,182,.5)}
.chk .meta{min-width:0;flex:1}
.chk b{display:block;font-weight:600;font-size:14px}
.chk small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.45}

/* Settings */
.set{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;background:var(--card);margin-bottom:6px}
.set .meta{flex:1;min-width:0}
.set b{display:block;font-weight:600;font-size:14px}
.set small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.switch{position:relative;flex:0 0 50px;height:30px;border-radius:15px;background:rgba(255,255,255,.08);border:1px solid var(--edge-2);transition:background .2s,box-shadow .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:rgba(56,225,255,.22);border-color:var(--cyan);box-shadow:0 0 14px rgba(56,225,255,.3)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--cyan)}
.voicerow{display:flex;align-items:center;gap:8px}
.voicerow select{flex:1;min-width:0;padding:12px;border-radius:12px;background:var(--card);color:var(--text);border:1px solid var(--edge);font:inherit;font-size:13.5px}
.rm{color:var(--red);font-size:12.5px;padding:6px 8px}

/* Driving bar */
.prog{height:3px;border-radius:2px;background:rgba(130,180,255,.12);overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 10px var(--cyan);transition:width .4s}
.dstats{display:flex;gap:6px;align-items:stretch}
.dstat{flex:1;padding:4px 6px;text-align:center}
.dstat b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.dstat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-top:5px}
.dstats .btn{flex:0 0 58px;padding:0;display:grid;place-items:center}
#endBtn{flex:0 0 auto;padding:0 18px}

/* Report modal and photo viewer */
.modal{position:fixed;inset:0;z-index:1200;display:grid;align-items:end;background:rgba(2,4,8,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbox{max-height:88vh;overflow-y:auto;padding:22px var(--sr) calc(var(--safe-b) + 18px) var(--sl);border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,rgba(16,26,44,.97),rgba(7,11,20,.98));border-top:1px solid var(--edge-2);animation:up .3s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.rhead{display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:0 0 108px;height:108px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:rgba(130,180,255,.12)}
.ring .arc{stroke:var(--g);stroke-linecap:round;stroke-dasharray:0 400;transition:stroke-dasharray 1s ease;filter:drop-shadow(0 0 6px var(--g))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;color:var(--g)}
#report[data-g="a"]{--g:var(--green)}#report[data-g="b"]{--g:var(--cyan)}#report[data-g="c"]{--g:var(--amber)}#report[data-g="d"]{--g:var(--red)}
.rhead h3{margin:2px 0 0;font-family:var(--display);font-size:26px;line-height:1.1;color:var(--g)}
.rhead small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-top:18px}
.rgrid div{padding:10px;border-radius:14px;background:var(--card);text-align:center}
.rgrid b{display:block;font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.rgrid span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;margin-top:3px}
.evs{display:grid;gap:6px;margin-top:14px}
.ev{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--card);font-size:13.5px}
.ev svg{width:18px;height:18px}
.ev-speed svg,.ev-roll svg{color:var(--red)}.ev-brake svg{color:var(--amber)}.ev-ok svg{color:var(--green)}
.viewer{position:fixed;inset:0;z-index:1300;background:rgba(2,4,8,.94);display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:78vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.vcap{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 18px);text-align:center;color:var(--muted);font-size:12.5px;padding:0 20px;display:grid;gap:6px}
.vx{position:absolute;right:var(--sr);top:calc(var(--safe-t) + 14px);width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--edge);font-size:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-map="dark">
<div id="map" aria-label="Map"></div>

<div id="hud" hidden>
  <div id="sign" class="sign" role="status" aria-live="polite">
    <div class="sicon" id="signIcon"></div>
    <div class="stxt"><div class="sdist" id="signDist"></div><div class="sinstr" id="signInstr"></div><div class="sthen" id="signThen" hidden></div></div>
  </div>
  <div id="alert" class="alert" hidden><span class="aic" id="alertIc"></span><span class="atx" id="alertTx"></span><b class="ad" id="alertD"></b></div>
</div>
<div id="dial" hidden>
  <svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="50"/><circle id="dialArc" class="arc" cx="60" cy="60" r="50"/></svg>
  <div class="dv"><b id="spd">–</b><span data-t="kmh"></span></div>
  <div id="limitSign" class="limit" aria-label="Speed limit"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="trafBtn" aria-label="Live traffic"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="19" rx="3"/><circle cx="12" cy="7" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="17" r="1.5"/></svg></button>
  <button class="fab" id="camBtn" aria-label="Speed cameras on map"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="7" width="13.5" height="10" rx="2"/><path d="m16 10.5 5.5-3v9l-5.5-3"/><circle cx="9.25" cy="12" r="2.6"/></svg></button>
  <button class="fab" id="locateBtn" aria-label="Show my location"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 20 20 12 16 4 20z" transform="rotate(45 12 12)"/></svg></button>
</div>
<button class="fab" id="recenter" hidden aria-label="Re-centre"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
<div id="toast" hidden></div>

<div id="sheet">
  <button id="grab" aria-label="Show or hide the panel"><span></span></button>
  <div class="panes" id="panes">

    <!-- GO -->
    <section data-pane="go">
      <form id="searchForm" class="search" autocomplete="off" role="search">
        <svg class="i lens" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="addr" type="search" enterkeyhint="search" aria-label="Search">
        <button class="clr" id="clearAddr" type="button" hidden aria-label="Clear">×</button>

        <div class="hero none" id="destHero"></div>
        <div class="cbody">
          <div class="top">
            <div class="meta"><h3 id="destName"></h3><small id="destSub"></small></div>
            <button class="x" id="destClose" type="button" aria-label="Close">×</button>
          </div>
          <div id="destBody"></div>
          <div class="gal" id="destGal" hidden></div>
          <div class="seg" id="modeSeg">
            <button type="button" data-mode="car"><svg class="i" viewBox="0 0 24 24"><path d="M5 16v-4l2-5h10l2 5v4M4 16h16M6 16v2.5M18 16v2.5M5 12h14"/></svg><span data-t="car"></span></button>
            <button type="button" data-mode="pt"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 17.5V20M16 17.5V20"/></svg><span data-t="pt"></span></button>
          </div>
          <div id="carBox">
            <div class="eta wait" id="destEta"></div>

            <a class="chip" id="gmaps" target="_blank" rel="noopener">Google Maps</a>
          </div>
        </div>
      </div>

      <div class="chips" id="places" style="margin-top:12px"></div>

      <div class="sub"><span data-t="nearby"></span></div>
      <div class="cats" id="cats"></div>
      <div id="nearWrap" hidden>
        <div class="sub"><span id="nearTitle"></span><button type="button" id="nearClose" data-t="clear"></button></div>
        <div class="list" id="nearList"></div>

    <!-- TEST -->
    <section data-pane="test" hidden>
      <div class="kicker" data-t="testKicker"></div>
      <h2><span data-t="practiceTitle"></span> <span id="loadState" style="font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)"></span></h2>
      <div class="list" id="routeList"></div>
      <div class="intel" id="intel"></div>
      <div class="actions">
        <button class="btn ghost" id="rehearseBtn" disabled data-t="rehearse"></button>
        <button class="btn primary" id="driveBtn" disabled data-t="drive"></button>
      </div>
      <button class="link" id="sheetToggle" type="button"></button>
      <div class="rsheet" id="routeSheet" hidden></div>
      <p class="note" data-t="practiceNote"></p>
      <div class="sub"><span data-t="reportsTitle"></span></div>
      <div class="list" id="reportList"></div>
      <div class="sub"><span data-t="prepTitle"></span><span id="prepCount"></span></div>
      <div id="prepList"></div>
      <p class="note" data-t="prepNote"></p>

    <!-- MORE -->
    <section data-pane="more" hidden>
      <h2 data-t="settings"></h2>
      <div class="sub" style="margin-top:4px"><span data-t="language"></span></div>
      <div class="seg" id="langSeg"><button type="button" data-lang="en">English</button><button type="button" data-lang="pl">Polski</button></div>
      <div class="sub"><span data-t="map"></span></div>
      <div class="seg" id="mapStyle">
        <button type="button" data-style="dark" data-t="dark"></button>
        <button type="button" data-style="light" data-t="light"></button>
        <button type="button" data-style="sat" data-t="sat"></button>
      </div>
      <div class="sub"><span data-t="traffic"></span></div>
      <div class="set keyset">
        <div class="meta"><b data-t="tt_t"></b><small data-t="tt_s"></small>
          <div class="keyrow"><input id="ttKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="••••••••••••••••" aria-label="TomTom API key"><button class="btn primary small" id="ttSave" type="button" data-t="tt_save"></button></div>
          <div class="keyfoot"><span id="ttStatus" class="kstat"></span><a href="https://developer.tomtom.com/" target="_blank" rel="noopener" data-t="tt_get"></a><button class="rm" id="ttRemove" type="button" data-t="tt_remove" hidden></button></div>
        </div>
      </div>
      <div class="set"><div class="meta"><b data-t="trafLayer_t"></b><small data-t="trafLayer_s"></small></div><button class="switch" role="switch" data-set="traffic" aria-label="Traffic on map"></button></div>
      <div class="sub"><span data-t="alerts"></span></div>
      <div class="set"><div class="meta"><b data-t="camLayer_t"></b><small data-t="camLayer_s"></small></div><button class="switch" role="switch" data-set="camLayer" aria-label="Cameras on map"></button></div>
      <div class="set"><div class="meta"><b data-t="cam_t"></b><small data-t="cam_s"></small></div><button class="switch" role="switch" data-set="camAlerts" aria-label="Camera alerts"></button></div>
      <div class="set"><div class="meta"><b data-t="hz_t"></b><small data-t="hz_s"></small></div><button class="switch" role="switch" data-set="hzAlerts" aria-label="Hazard alerts"></button></div>
      <div class="sub"><span data-t="driving"></span></div>
      <div class="set"><div class="meta"><b data-t="sl_t"></b><small data-t="sl_s"></small></div><button class="switch" role="switch" data-set="limits" aria-label="Speed limit"></button></div>
      <div class="set"><div class="meta"><b data-t="lv_t"></b><small data-t="lv_s"></small></div><button class="switch" role="switch" data-set="limitVoice" aria-label="Announce limits"></button></div>
      <div class="set"><div class="meta"><b data-t="sw_t"></b><small data-t="sw_s"></small></div><button class="switch" role="switch" data-set="speedWarn" aria-label="Speeding warning"></button></div>
      <div class="sub"><span data-t="voice"></span></div>
      <div class="voicerow">
        <select id="voiceSel" aria-label="Voice"><option>Phone default</option></select>
        <button class="btn ghost small" id="testVoice" type="button" data-t="test"></button>
      </div>
      <div class="sub"><span data-t="saved"></span></div>
      <div class="list" id="savedList"></div>
      <p class="note" data-t="moreNote"></p>
      <p class="note" data-th="credits"></p>
    </section>
  </div>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="go" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 19 20 12 16 5 20z"/></svg><span data-t="tab_go"></span></button>
    <button role="tab" data-tab="explore" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 19 9 8.5l4 6.5 3-4.5 5.5 8.5z"/><circle cx="17" cy="5.5" r="1.8"/></svg><span data-t="tab_explore"></span></button>
    <button role="tab" data-tab="test" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M10 8v8h5"/></svg><span data-t="tab_test"></span></button>
    <button role="tab" data-tab="more" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-t="tab_more"></span></button>
  </nav>

  <section id="driveView" hidden>
    <div class="prog"><i id="prog"></i></div>
    <div class="dstats">
      <div class="dstat"><b id="statA">–</b><span id="statAL"></span></div>
      <div class="dstat"><b id="statB">–</b><span id="statBL"></span></div>
      <div class="dstat"><b id="statC">–</b><span id="statCL"></span></div>
      <button class="btn ghost icon" id="muteBtn" aria-label="Voice on or off"></button>
      <button class="btn danger" id="endBtn" data-t="end"></button>
    </div>
  </section>
</div>

<div id="report" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="rGrade">
    <div class="kicker" data-t="rep_title"></div>
    <div class="rhead">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"/><circle id="rArc" class="arc" cx="50" cy="50" r="44"/></svg><b id="rScore"></b></div>
      <div><h3 id="rGrade"></h3><small id="rSub"></small></div>
    </div>
    <div class="rgrid" id="rStats"></div>
    <div class="evs" id="rEvents"></div>
    <p class="note" data-t="rep_note"></p>
    <div class="actions"><button class="btn primary" id="rClose" type="button" data-t="rep_done"></button></div>
  </div>
</div>

<div id="viewer" class="viewer" hidden>
  <button class="vx" id="vClose" type="button" aria-label="Close">×</button>
  <img id="vImg" alt="">
  <div class="vcap"><span id="vCap"></span><a id="vLink" target="_blank" rel="noopener"></a></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
